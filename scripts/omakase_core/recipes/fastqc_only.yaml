# The smallest recipe that can be run live today, and the default while the real catalog
# does not exist. One step, no reference genome, a few minutes on the cluster.
#
# It is here so the whole path -- detection, candidate, proposal, human approval, chain
# runner, completion -- can be exercised against real data on fgcz-h-083 without waiting
# for a bioinformatician to author anything. It proposes nothing scientific.

id: fastqc_only
version: v1
description: >
  Quality-control the raw reads. A single step, used to prove the machinery end to end
  against real data; it is not a recommendation for any real order.

# The real catalog matches on order metadata (design v0.3 §5). This one matches
# everything, because choosing a recipe is not what the first slice tests.
match:
  always: true

steps:
  - seq: 1
    app_name: FastqcApp
    depends_on_seq: null
    parameters:
      cores: 1
      ram: 15
      scratch: 10
    # FastqcApp declares ram as a selector offering [15, 30, 62], so the larger attempt is
    # the next rung rather than double. The recipe states it because the app author knows
    # the ladder and the runner does not.
    retry_parameters:
      cores: 1
      ram: 30
      scratch: 50
